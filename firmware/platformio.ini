; Minidisp firmware — PC status display for ESP32 touch screens
;
; Uses the pioarduino platform (Arduino core 3.x / IDF 5.x) so classic ESP32,
; ESP32-S3 and ESP32-C6 all build from one platform. See docs/RESEARCH-hardware.md.

[platformio]
default_envs = cyd

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=1
    -DMINIDISP_VERSION=\"0.2.0\"
lib_deps =
    lvgl/lvgl@^9.2.2
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; CYD "Cheap Yellow Display" ESP32-2432S028R — 2.8" ILI9341 320x240,
; XPT2046 resistive touch, CH340 UART, 4MB flash, no PSRAM. PRIMARY TARGET.
[env:cyd]
board = esp32dev
board_build.partitions = partitions/minidisp_4mb.csv
build_flags =
    ${env.build_flags}
    -DMINIDISP_BOARD_CYD
    -DMINIDISP_BOARD_NAME=\"cyd\"

; CYD v3 variant that ships an ST7789 panel (silkscreen "7789") instead of
; ILI9341. Same board otherwise. Use if the display shows garbage/wrong colors.
[env:cyd-st7789]
board = esp32dev
board_build.partitions = partitions/minidisp_4mb.csv
build_flags =
    ${env.build_flags}
    -DMINIDISP_BOARD_CYD
    -DCYD_PANEL_ST7789
    -DMINIDISP_BOARD_NAME=\"cyd-st7789\"

; ---------------------------------------------------------------------------
; Waveshare ESP32-C6-Touch-LCD-1.47 — 172x320 ST7789, native USB CDC, 8MB flash.
; Compiles now; pins must be verified against the Waveshare wiki at bring-up.
[env:esp32c6-147]
board = esp32-c6-devkitc-1
board_build.partitions = partitions/minidisp_8mb.csv
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DMINIDISP_BOARD_C6_147
    -DMINIDISP_BOARD_NAME=\"esp32c6-147\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1 ; C6 uses the HW USB-Serial/JTAG peripheral (HWCDC)

; ---------------------------------------------------------------------------
; ESP32-1732S019 — 1.9" 170x320 ST7789 on ESP32-S3, no touch.
; Compiles now; pins must be verified at bring-up.
[env:esp32-1732s019]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/minidisp_4mb.csv
build_flags =
    ${env.build_flags}
    -DMINIDISP_BOARD_1732S019
    -DMINIDISP_BOARD_NAME=\"esp32-1732s019\"
    -DARDUINO_USB_CDC_ON_BOOT=1
